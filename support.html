<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VoyageShelf Support</title>
<style>
  :root {
    --paper: #F4EFE4;
    --paper-alt: #FBF8F0;
    --ink: #3A2E28;
    --ink-soft: #6B5D50;
    --rule: #C9BFA8;
    --accent: #7A3A38;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #2A2420;
      --paper-alt: #221D1A;
      --ink: #F0E9DD;
      --ink-soft: #C9BFA8;
      --rule: #4A4038;
      --accent: #D98B85;
    }
  }
  :root[data-theme="dark"] {
    --paper: #2A2420;
    --paper-alt: #221D1A;
    --ink: #F0E9DD;
    --ink-soft: #C9BFA8;
    --rule: #4A4038;
    --accent: #D98B85;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.6;
  }
  .wrap {
    max-width: 680px;
    margin: 0 auto;
    padding: 56px 24px 80px;
  }
  h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: clamp(28px, 5vw, 40px);
    margin: 0 0 6px;
  }
  .subtitle {
    color: var(--ink-soft);
    font-size: 15px;
    margin: 0 0 40px;
  }
  h2 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 20px;
    border-bottom: 1px solid var(--rule);
    padding-bottom: 8px;
    margin-top: 40px;
  }
  p, li { font-size: 16px; }
  ul { padding-left: 20px; }
  .card {
    background: var(--paper-alt);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 18px 20px;
    margin: 28px 0;
  }
  .contact {
    font-family: Georgia, serif;
    font-style: italic;
    color: var(--accent);
  }
  footer {
    margin-top: 56px;
    color: var(--ink-soft);
    font-size: 13px;
    border-top: 1px solid var(--rule);
    padding-top: 16px;
  }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Support</h1>
  <p class="subtitle">VoyageShelf</p>

  <div class="card">
    <strong>Need help, found a bug, or have a suggestion?</strong> Reach out any time — we read every message.
  </div>

  <h2>Contact</h2>
  <p>Email us at <span class="contact">voyageshelf@gmail.com</span> and we'll get back to you as soon as we can.</p>

  <h2>Privacy</h2>
  <p>Wondering how your data is handled? See our <a href="privacy.html">Privacy Policy</a>.</p>

  <footer>VoyageShelf</footer>
</div>
</body>
</html>
